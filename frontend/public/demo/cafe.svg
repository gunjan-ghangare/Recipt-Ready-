<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="'Courier New', monospace" fill="#222">
  <!-- Synthetic demo receipt. Not a real business. -->
  <defs><filter id="smudge"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
  <rect width="400" height="700" fill="#fdfcf7"/>
  <text x="200" y="80" font-size="30" font-weight="bold" text-anchor="middle">BLUEBIRD CAFÉ</text>
  <text x="200" y="110" font-size="14" text-anchor="middle">12 Harbor Lane · Springfield</text>
  <text x="36" y="151" font-size="16">DATE</text>
  <text x="86" y="151" font-size="18">03/04/26</text>
  <text x="362" y="151" font-size="16" text-anchor="end">10:42</text>
  <line x1="32" y1="172" x2="368" y2="172" stroke="#999" stroke-dasharray="4 4"/>
  <text x="36" y="204" font-size="18">Flat white</text><text x="362" y="204" font-size="18" text-anchor="end">4.50</text>
  <text x="36" y="235" font-size="18">Avocado toast</text><text x="362" y="235" font-size="18" text-anchor="end">11.00</text>
  <text x="36" y="266" font-size="18">Sparkling water</text><text x="362" y="266" font-size="18" text-anchor="end">3.00</text>
  <line x1="32" y1="290" x2="368" y2="290" stroke="#999" stroke-dasharray="4 4"/>
  <text x="36" y="322" font-size="17">Subtotal</text><text x="362" y="322" font-size="17" text-anchor="end">18.50</text>
  <text x="36" y="350" font-size="17">Tax</text><text x="362" y="350" font-size="17" text-anchor="end">1.62</text>
  <text x="36" y="394" font-size="24" font-weight="bold">TOTAL</text>
  <text x="362" y="394" font-size="24" font-weight="bold" text-anchor="end">$20.12</text>
  <ellipse cx="318" cy="384" rx="58" ry="17" fill="#8a7a5c" opacity="0.35" filter="url(#smudge)"/>
  <text x="200" y="470" font-size="15" text-anchor="middle">CARD ****4821</text>
  <text x="200" y="520" font-size="15" text-anchor="middle">Thank you, come again!</text>
  <text x="200" y="660" font-size="11" text-anchor="middle" fill="#7a5bd6">SYNTHETIC DEMO RECEIPT</text>
</svg>
